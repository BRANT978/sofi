    <section class="hero" aria-labelledby="page-title">
      <div class="hero-copy">
        <h1 id="page-title">Sofi.</h1>
        <p class="intro">Hay algo que sí quería agradecerte.</p>
      </div>

      <figure class="daughter-mark">
        <svg class="heart" viewBox="0 0 400 360" role="img" aria-labelledby="heart-title heart-description">
          <title id="heart-title">Un corazón para Gabriela</title>
          <desc id="heart-description">Un corazón dibujado con una línea fina y el nombre Gabriela en el centro.</desc>
          <defs>
            <linearGradient id="heart-glint-color" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#8e3c49" stop-opacity="0"></stop>

    <section class="message" id="message">
      <p class="message-copy" id="message-copy">Sofi, gracias por esa bebé tan bonita que hicimos juntos. Mire lo perfecta que nos quedó. ❤️ No sé si alguna vez te lo he dicho así, pero siempre voy a estar agradecido contigo por darme algo tan lindo como Gabriela.</p>
      <svg class="message-heart" id="message-heart" viewBox="0 0 32 32" aria-hidden="true">
